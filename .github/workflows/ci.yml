name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy pydantic pydantic-settings fastapi
      - run: mypy mira/ --ignore-missing-imports --no-error-summary || true
        # Non-blocking until existing issues are resolved

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      MIRA_ENV: test
      MIRA_SKIP_DB_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x -q \
            --ignore=tests/model_eval \
            --ignore=tests/mira_v4 \
            -k "not integration and not slow"
