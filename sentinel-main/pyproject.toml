[project]
name = "gptl"
version = "1.0.0"
description = "GPTL - Grounded Precision Translation Layer for SENTINEL"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dr. Joseph Wilde", email = "jnwilde@pm.me" },
    { name = "Claude Opus 4.5", email = "noreply@anthropic.com" },
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anthropic>=0.18.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7.4"]
cpu = ["faiss-cpu>=1.7.4"]
db = ["asyncpg>=0.29.0", "sqlalchemy>=2.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
all = [
    "gptl[cpu]",
    "gptl[db]",
    "gptl[dev]",
]

[project.scripts]
sentinel = "gptl.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gptl"]

[tool.hatch.build.targets.wheel.force-include]
"gptl/domains" = "gptl/domains"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
