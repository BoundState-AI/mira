[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundstate"
version = "0.1.0"
description = "BoundState MIRA Platform - Materials Intelligence & Risk Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "BoundState Team"}
]

dependencies = [
    # Core API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",

    # AI/ML - Anthropic
    "anthropic>=0.40.0",

    # AI/ML - Embeddings & Vector Search
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "scipy>=1.11.0",

    # AWS
    "boto3>=1.34.0",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",

    # PDF Processing
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pypdf2>=3.0.0",

    # Data Processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",

    # HTTP Client
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "cachetools>=5.3.0",

    # CLI
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

gpu = [
    # For GPU-accelerated FAISS (requires CUDA)
    "faiss-gpu>=1.8.0",
]

full = [
    # Frontend
    "streamlit>=1.36.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "passlib[bcrypt]>=1.7.0",

    # Caching
    "redis>=5.0.0",

    # Graph DB
    "neo4j>=5.20.0",

    # Visualization
    "plotly>=5.15.0",

    # Monitoring
    "psutil>=5.9.0",
]

[project.scripts]
mira = "mira.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mira", "core", "services", "data", "sentinel"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
