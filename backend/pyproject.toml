[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mira-backend"
version = "0.1.0"
description = "BoundState MIRA Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
