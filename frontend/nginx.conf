server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles should be immutable and must 404 if missing.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate HTML entrypoint so clients pick up latest bundle hash.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Fail closed for unknown deep links. Only explicit client routes should
    # resolve to the SPA shell; backend-looking paths must 404 instead of
    # returning index.html and masquerading as live endpoints.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(chat|query|gas-compatibility|galvanic-compatibility|fracture-control|oca|miul|mua|compliance|mp-plan|dt-editor|v4-query|bsmh|mua-v7|mua-v8|mua-v10|forge|forge-explorer|tocr|knowledge-twins|test-classes)$ {
        try_files /index.html =404;
    }

    location ~ ^/oca/(workbench|system-builder)$ {
        try_files /index.html =404;
    }

    location ~ ^/test-classes/(tvs-outgassing|flammability|mechanical-impact|toxicity|stress-corrosion-cracking|corrosion|fluid-compatibility|odor|flash-fire|tensile-strength|pneumatic-impact|promoted-combustion|particle-impact|electrical-overload|vcm-optical|electric-wire-insulation|low-cycle-fatigue|fungus|fracture-mechanics|creep-rupture|high-cycle-fatigue|friction-heat|crack-growth|arc-tracking)$ {
        try_files /index.html =404;
    }

    location ~ ^/mua/(v7|v8|v10|matchmaker)$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
