[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mua-precedent-engine"
version = "1.0.0"
description = "NASA Material Usage Agreement Precedent Reuse System"
readme = "README.md"
license = "Proprietary"
requires-python = ">=3.11"
authors = [
    { name = "Dr. Joseph Wilde", email = "joseph@boundstate.ai" },
    { name = "Claude", email = "noreply@anthropic.com" },
    { name = "Fran", email = "noreply@openai.com" },
    { name = "Grok", email = "noreply@x.ai" },
]
keywords = [
    "nasa",
    "mua",
    "material-usage-agreement",
    "precedent-engine",
    "safety-critical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "sentence-transformers>=2.2",
    "qdrant-client>=1.8",
    "boto3>=1.34",
    "typer>=0.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3",
]
clustering = [
    "hdbscan>=0.8",
    "scipy>=1.12",
]
all = [
    "mua-precedent-engine[dev,clustering]",
]

[project.scripts]
mua-precedent = "mua_precedent_engine.cli:app"

[project.urls]
Homepage = "https://boundstate.ai"
Documentation = "https://boundstate.ai/docs/mua-precedent-engine"
Repository = "https://github.com/boundstate/mua-precedent-engine"

[tool.hatch.build.targets.wheel]
packages = ["mua_precedent_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
