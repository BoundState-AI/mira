# NASA-STD-6016C Material and Process Requirements Index
# Version: C w/CHANGE 2
# Source: NASA-STD-6016C "Standard Materials and Processes Requirements for Spacecraft"
#
# This is the authoritative source for MPR definitions used by the M&P Plan
# compliance evaluation engine (codex path).
#
# Structure:
#   Section 4.1  - Programmatic Controls (MPR 7-32)
#   Section 4.1.8 - Design Values (MPR 33-42)
#   Section 4.2.1 - Flammability, Offgassing, Compatibility (MPR 43-56)
#   Section 4.2.2 - Metals (MPR 57-88)
#   Section 4.2.3 - Nonmetals (MPR 89-101)
#   Section 4.2.4 - Processes (MPR 102-174)
#   Section 4.2.5 - NDE (MPR 175-180)
#   Section 4.2.6 - Structural/Corrosion/Contamination (MPR 182-209)
#   Section 4.2.1.4 - Oxidizer Compatibility (MPR 210-212)
#
# Entries with empty related_failure_modes produce STATUS_UNKNOWN determinations
# that require human citation. This is intentional — the engine should surface
# every applicable requirement, not silently skip non-deterministic ones.
#
# Prohibition entries carry a "prohibition" key with material_keywords and
# environment_condition for deterministic NONCOMPLIANT evaluation.

standard_version: "C"
source_document: "NASA-STD-6016C"
source_document_version: "Rev C w/CHANGE 2"
last_updated: "2026-03-14"

mprs:

  # ===========================================================================
  # SECTION 4 - GENERAL REQUIREMENTS (MPR 7-8)
  # ===========================================================================
  - mpr_number: 7
    mpr_id: "MPR-007"
    section: "4"
    title: "Useful Life Requirements"
    shall_text: "Materials shall meet the worst-case useful-life requirements for the particular application."
    verification_method: "Analysis/Test"
    applicability_triggers:
      - "always"
    related_failure_modes:
      - "missing_input"
    priority: 10

  - mpr_number: 8
    mpr_id: "MPR-008"
    section: "4"
    title: "GSE/Test Equipment M&P Controls"
    shall_text: "M&P used in interfacing GSE, test equipment, hardware packaging, and hardware shipment shall be controlled to prevent damage to or contamination of spaceflight hardware."
    verification_method: "Inspection"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 45

  # ===========================================================================
  # SECTION 4.1.1 - M&P PLAN CONTENT (MPR 9-14)
  # ===========================================================================
  - mpr_number: 9
    mpr_id: "MPR-009"
    section: "4.1.1"
    title: "M&P Plan Requirement"
    shall_text: "Each organization responsible for design and fabrication of spaceflight hardware shall provide a Materials and Processes Selection, Control, and Implementation Plan."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 5

  - mpr_number: 10
    mpr_id: "MPR-010"
    section: "4.1.1"
    title: "Subcontractor Compliance"
    shall_text: "The M&P Plan shall also describe the methods used to control compliance by subcontractors and vendors."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 10

  - mpr_number: 11
    mpr_id: "MPR-011"
    section: "4.1.1"
    title: "M&P Plan as Implementation Document"
    shall_text: "Upon approval by the procuring activity, the M&P Plan shall become the M&P implementation document used for verification."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 10

  - mpr_number: 12
    mpr_id: "MPR-012"
    section: "4.1.1.1"
    title: "Drawing Coordination"
    shall_text: "The M&P Plan shall identify the method of coordinating, approving, and tracking all engineering drawings."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 15

  - mpr_number: 13
    mpr_id: "MPR-013"
    section: "4.1.1.2"
    title: "M&P Drawing Approval"
    shall_text: "The M&P Plan shall include a requirement that all hardware design drawings and revisions for spaceflight hardware have M&P approval signature."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 15

  - mpr_number: 14
    mpr_id: "MPR-014"
    section: "4.1.1.3"
    title: "Manufacturing Participation"
    shall_text: "The M&P Plan shall identify how the responsible M&P organization participates in manufacturing and processing."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 15

  # ===========================================================================
  # SECTION 4.1.2 - SPECIFICATIONS & DRAWINGS (MPR 15-21)
  # ===========================================================================
  - mpr_number: 15
    mpr_id: "MPR-015"
    section: "4.1.2"
    title: "M&P Defined by Standards"
    shall_text: "All M&P for spaceflight hardware providing mission-critical functions shall be defined by standards and specifications."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 20

  - mpr_number: 16
    mpr_id: "MPR-016"
    section: "4.1.2"
    title: "Drawing Identification"
    shall_text: "All M&P for spaceflight hardware providing mission-critical functions shall be identified directly on the appropriate engineering drawing."
    verification_method: "Inspection"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 20

  - mpr_number: 17
    mpr_id: "MPR-017"
    section: "4.1.2"
    title: "Company Specs in Plan"
    shall_text: "Company M&P specifications shall be identified by document number in the M&P Plan."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 25

  - mpr_number: 18
    mpr_id: "MPR-018"
    section: "4.1.2"
    title: "Specs Available to NASA"
    shall_text: "All M&P specifications used to produce spaceflight hardware providing mission-critical functions shall be made available to NASA."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 25

  - mpr_number: 19
    mpr_id: "MPR-019"
    section: "4.1.2"
    title: "Process Specification Detail"
    shall_text: "Process specifications for spaceflight hardware providing mission-critical functions shall define process steps at a level ensuring repeatable/controlled process."
    verification_method: "Inspection"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 25

  - mpr_number: 20
    mpr_id: "MPR-020"
    section: "4.1.2"
    title: "Process Qualification"
    shall_text: "Process qualification shall be conducted to demonstrate the repeatability of all processes for spaceflight hardware providing mission-critical functions."
    verification_method: "Inspection"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 25

  - mpr_number: 21
    mpr_id: "MPR-021"
    section: "4.1.2.1"
    title: "Standards Update Evaluation"
    shall_text: "A process shall be established for ensuring that updated, alternate, or new material or process standards are evaluated."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 30

  # ===========================================================================
  # SECTION 4.1.3-4.1.5 - COTS, PANEL, MIUL (MPR 22-27)
  # ===========================================================================
  - mpr_number: 22
    mpr_id: "MPR-022"
    section: "4.1.3"
    title: "Vendor/COTS M&P Coverage"
    shall_text: "A procedure shall be established to ensure that all vendor-designed, off-the-shelf, and vendor-furnished items are covered by M&P requirements."
    verification_method: "Documentation"
    applicability_triggers:
      - "cots"
    related_failure_modes: []
    priority: 25

  - mpr_number: 23
    mpr_id: "MPR-023"
    section: "4.1.4"
    title: "M&P Control Panel"
    shall_text: "An M&P control panel shall be established by each contractor hardware provider."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 20

  - mpr_number: 24
    mpr_id: "MPR-024"
    section: "4.1.4"
    title: "Panel Scope in Plan"
    shall_text: "The M&P control panel scope and membership shall be described in the M&P Plan."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 20

  - mpr_number: 25
    mpr_id: "MPR-025"
    section: "4.1.5"
    title: "MIUL Documentation"
    shall_text: "M&P usage shall be documented in an electronic, searchable parts list or separate MIUL."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 15

  - mpr_number: 26
    mpr_id: "MPR-026"
    section: "4.1.5"
    title: "Final Design Coverage"
    shall_text: "The documentation of M&P usage shall cover the final design as delivered."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 20

  - mpr_number: 27
    mpr_id: "MPR-027"
    section: "4.1.5"
    title: "Documentation Approach in Plan"
    shall_text: "The documentation approach shall be defined in the M&P Plan."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 20

  # ===========================================================================
  # SECTION 4.1.6-4.1.7 - MUA & CERTIFICATION (MPR 28-32)
  # ===========================================================================
  - mpr_number: 28
    mpr_id: "MPR-028"
    section: "4.1.6"
    title: "MUA Submittal"
    shall_text: "MUAs containing sufficient information to demonstrate acceptability shall be submitted by the responsible M&P organization."
    verification_method: "Documentation"
    applicability_triggers:
      - "nonconforming"
    related_failure_modes:
      - "flam"
      - "hee"
      - "o2_prohibited"
      - "o2_restricted"
    priority: 10

  - mpr_number: 29
    mpr_id: "MPR-029"
    section: "4.1.6"
    title: "MUA Prohibition for Nonconforming Product"
    shall_text: "MUAs shall not be used to change the M&P requirements for a nonconforming product."
    verification_method: "Documentation"
    applicability_triggers:
      - "nonconforming"
    related_failure_modes: []
    priority: 5

  - mpr_number: 30
    mpr_id: "MPR-030"
    section: "4.1.7"
    title: "Material Certification"
    shall_text: "All parts or materials for spaceflight hardware providing mission-critical functions shall be certified as to composition, properties, and requirements."
    verification_method: "Inspection"
    applicability_triggers:
      - "always"
    related_failure_modes:
      - "missing_input"
    priority: 20

  - mpr_number: 31
    mpr_id: "MPR-031"
    section: "4.1.7"
    title: "Material Traceability"
    shall_text: "With the exception of off-the-shelf parts, parts and materials used in critical applications shall be traceable."
    verification_method: "Inspection"
    applicability_triggers:
      - "always"
    related_failure_modes:
      - "missing_input"
    priority: 25

  - mpr_number: 32
    mpr_id: "MPR-032"
    section: "4.1.7"
    title: "Distributor Heat Treatment Prohibition"
    shall_text: "Distributors or other processors shall not heat treat, hot work, or cold work metal stock unless they take responsibilities as the producer."
    verification_method: "Inspection"
    applicability_triggers:
      - "metallic_material"
      - "heat_treated"
    related_failure_modes:
      - "scc"
      - "hee"
    priority: 20

  # ===========================================================================
  # SECTION 4.1.8 - DESIGN VALUES (MPR 33-42)
  # ===========================================================================
  - mpr_number: 33
    mpr_id: "MPR-033"
    section: "4.1.8"
    title: "Statistical Design Values"
    shall_text: "A, B, or S-basis statistical values for mechanical properties shall be utilized for design and analysis."
    verification_method: "Analysis"
    applicability_triggers:
      - "metallic_material"
    related_failure_modes:
      - "fs"
    priority: 20

  - mpr_number: 35
    mpr_id: "MPR-035"
    section: "4.1.8.1"
    title: "MMPDS Values"
    shall_text: "A, B, or S-basis statistical methods shall be defined by, and values taken from MMPDS."
    verification_method: "Analysis"
    applicability_triggers:
      - "metallic_material"
    related_failure_modes:
      - "fs"
    priority: 20

  - mpr_number: 39
    mpr_id: "MPR-039"
    section: "4.1.8.2"
    title: "Property Data Availability"
    shall_text: "All contractor-developed mechanical and physical property data shall be made available to the responsible NASA M&P organization."
    verification_method: "Documentation"
    applicability_triggers:
      - "always"
    related_failure_modes: []
    priority: 30

  - mpr_number: 40
    mpr_id: "MPR-040"
    section: "4.1.8.2"
    title: "B-Value Redundant Structure Only"
    shall_text: "Material B design values shall not be used except in redundant structure."
    verification_method: "Analysis"
    applicability_triggers:
      - "metallic_material"
    related_failure_modes:
      - "fs"
    priority: 15

  - mpr_number: 42
    mpr_id: "MPR-042"
    section: "4.1.8.3"
    title: "Structural Fastener Design Values"
    shall_text: "Structural fastener design values shall be defined by minimum load test requirements."
    verification_method: "Test"
    applicability_triggers:
      - "fastener"
    related_failure_modes:
      - "fs"
    priority: 20

  # ===========================================================================
  # SECTION 4.2.1 - FLAMMABILITY, OFFGASSING, COMPATIBILITY (MPR 43-56)
  # ===========================================================================
  - mpr_number: 43
    mpr_id: "MPR-043"
    section: "4.2.1"
    title: "Flammability/Offgassing/Compatibility - General"
    shall_text: "Materials shall meet the requirements of NASA-STD-6001B, Flammability, Offgassing, and Compatibility."
    verification_method: "Test"
    applicability_triggers:
      - "habitable"
      - "oxygen_service"
    related_failure_modes:
      - "flam"
      - "offgas"
      - "tox"
    priority: 5

  - mpr_number: 44
    mpr_id: "MPR-044"
    section: "4.2.4.3"
    title: "Flammability - Use Limitations"
    shall_text: "Materials not meeting flammability requirements shall be controlled through approved closure paths."
    verification_method: "Analysis/Documentation"
    applicability_triggers:
      - "habitable"
      - "oxygen_service"
    related_failure_modes:
      - "flam"
      - "o2_prohibited"
      - "o2_restricted"
    exceptions:
      - path: "MINOR_QUANTITY"
        citation: "4.2.4.3(c)"
        description: "Materials may be used if total mass <45g AND surface area <13cm² in aggregated zone"
      - path: "CONFIGURATION_ANALYSIS"
        citation: "4.2.4.3(h)"
        description: "Materials may be used if configuration analysis demonstrates self-extinguishing behavior"
      - path: "HEAT_SINK"
        citation: "4.2.4.3(g)"
        description: "Materials may be used if bonded to metal heat sink meeting mass ratio requirements"
      - path: "SUBSTITUTION"
        citation: "4.2.4.3(a)"
        description: "Alternative A-rated material available and acceptable"
      - path: "TEST_PROGRAM"
        citation: "4.2.4.3(i)"
        description: "Additional testing at use conditions demonstrates compliance"
      - path: "FULL_MUA"
        citation: "4.2.4.3(j)"
        description: "Material Usage Agreement with full engineering rationale"
    priority: 5

  - mpr_number: 45
    mpr_id: "MPR-045"
    section: "4.2.4.4"
    title: "Flammability - Oxygen Service"
    shall_text: "Materials in oxygen service shall be evaluated for ignition and combustion in the maximum expected oxygen concentration."
    verification_method: "Test/Analysis"
    applicability_triggers:
      - "oxygen_service"
    related_failure_modes:
      - "flam"
      - "o2_prohibited"
    priority: 10

  - mpr_number: 46
    mpr_id: "MPR-046"
    section: "4.2.1.2"
    title: "SMAC Values"
    shall_text: "Spacecraft maximum allowable concentration (SMAC) values shall be obtained from JSC 20584."
    verification_method: "Analysis"
    applicability_triggers:
      - "habitable"
    related_failure_modes:
      - "tox"
    priority: 20

  - mpr_number: 47
    mpr_id: "MPR-047"
    section: "4.2.1.3"
    title: "Fluid Compatibility MUA"
    shall_text: "An MUA shall be written rationalizing the selection of materials for fluid compatibility."
    verification_method: "Documentation"
    applicability_triggers:
      - "fluid_contact"
    related_failure_modes:
      - "corr"
    priority: 20

  - mpr_number: 49
    mpr_id: "MPR-049"
    section: "4.2.1.3"
    title: "Long-Term Degradation"
    shall_text: "Materials degradation in long-term tests shall be characterized by post-test analyses."
    verification_method: "Test"
    applicability_triggers:
      - "fluid_contact"
    related_failure_modes:
      - "corr"
    priority: 30

  - mpr_number: 50
    mpr_id: "MPR-050"
    section: "4.2.1.3"
    title: "Weld/HAZ Compatibility"
    shall_text: "The effect of material condition (parent vs. weld metal or HAZ) shall be addressed in compatibility determination."
    verification_method: "Test/Analysis"
    applicability_triggers:
      - "welded"
      - "fluid_contact"
    related_failure_modes:
      - "corr"
    priority: 30

  - mpr_number: 51
    mpr_id: "MPR-051"
    section: "4.2.1.4"
    title: "Oxygen Compatibility Evaluation"
    shall_text: "Materials and components in oxygen systems shall be evaluated for oxygen compatibility."
    verification_method: "Test/Analysis"
    applicability_triggers:
      - "oxygen_service"
    related_failure_modes:
      - "flam"
      - "o2_prohibited"
    priority: 10

  - mpr_number: 52
    mpr_id: "MPR-052"
    section: "4.2.1.4"
    title: "Oxygen Compatibility Assessment"
    shall_text: "When materials are determined flammable, an oxygen compatibility assessment shall be conducted per NASA-STD-6001B."
    verification_method: "Test/Analysis"
    applicability_triggers:
      - "oxygen_service"
    related_failure_modes:
      - "flam"
      - "o2_prohibited"
    priority: 10

  - mpr_number: 54
    mpr_id: "MPR-054"
    section: "4.2.1.5"
    title: "Wire Insulation Flammability"
    shall_text: "Electrical wire insulation materials shall be evaluated for flammability per NASA-STD-6001B, Test 4 or Test 1."
    verification_method: "Test"
    applicability_triggers:
      - "wiring"
      - "cable"
    related_failure_modes:
      - "flam"
    priority: 15

  - mpr_number: 55
    mpr_id: "MPR-055"
    section: "4.2.1.5"
    title: "Arc Tracking"
    shall_text: "Arc tracking shall be evaluated per NASA-STD-6001B, Test 18."
    verification_method: "Test"
    applicability_triggers:
      - "wiring"
      - "cable"
    related_failure_modes:
      - "flam"
    priority: 20

  - mpr_number: 53
    mpr_id: "MPR-053"
    section: "4.2.5.2"
    title: "Offgassing - Trace Contaminants"
    shall_text: "Material offgassing shall not exceed spacecraft maximum allowable concentration (SMAC) limits for individual compounds."
    verification_method: "Test/Analysis"
    applicability_triggers:
      - "habitable"
    related_failure_modes:
      - "offgas"
      - "tox"
    priority: 20

  - mpr_number: 56
    mpr_id: "MPR-056"
    section: "4.2.5.5"
    title: "Odor"
    shall_text: "Materials in habitable volumes shall not produce objectionable odors."
    verification_method: "Test"
    applicability_triggers:
      - "habitable"
    related_failure_modes:
      - "odor"
    priority: 40

  # ===========================================================================
  # SECTION 4.2.2 - METALS (MPR 57-88)
  # Includes PROHIBITION entries for deterministic NONCOMPLIANT evaluation
  # ===========================================================================

  # --- Aluminum ---
  - mpr_number: 57
    mpr_id: "MPR-057"
    section: "4.2.2.1"
    title: "Aluminum 5xxx Magnesium Content Temperature Limit"
    shall_text: "The 5000-series alloys containing more than 3% magnesium shall not be used where temperature exceeds 66°C (150°F)."
    verification_method: "Analysis"
    applicability_triggers:
      - "aluminum_alloy"
    related_failure_modes:
      - "scc"
      - "corr"
    priority: 10
    prohibition:
      type: "material_temperature"
      material_keywords: ["5052", "5056", "5083", "5086", "5154", "5356", "5454", "5456"]
      max_temp_c: 66.0
      rationale: "5xxx Al >3% Mg sensitizes above 66°C, leading to intergranular corrosion and SCC"

  # --- Steel ---
  - mpr_number: 59
    mpr_id: "MPR-059"
    section: "4.2.2.2.1"
    title: "High-Strength Steel Machining Verification"
    shall_text: "The absence of machining damage for high-strength steels shall be verified by microexamination."
    verification_method: "Inspection"
    applicability_triggers:
      - "high_strength_alloy"
    related_failure_modes:
      - "fs"
      - "scc"
    priority: 20

  - mpr_number: 60
    mpr_id: "MPR-060"
    section: "4.2.2.2.2"
    title: "Unstabilized Austenitic Steel Temperature Limit"
    shall_text: "Unstabilized, austenitic steels shall not be processed or used above 371°C (700°F)."
    verification_method: "Analysis"
    applicability_triggers:
      - "metallic_material"
    related_failure_modes:
      - "scc"
      - "corr"
    priority: 10
    prohibition:
      type: "material_temperature"
      material_keywords: ["304", "316", "304l", "316l", "321"]
      exclude_keywords: ["321", "347", "stabilized"]
      max_temp_c: 371.0
      rationale: "Unstabilized austenitic steels sensitize above 371°C, causing intergranular corrosion"

  - mpr_number: 62
    mpr_id: "MPR-062"
    section: "4.2.2.2.2"
    title: "Free-Machining Steel Prohibition"
    shall_text: "Free-machining alloys (such as 303) shall not be used in mission-critical functions where corrosion is a concern."
    verification_method: "Analysis"
    applicability_triggers:
      - "metallic_material"
    related_failure_modes:
      - "corr"
    priority: 15
    prohibition:
      type: "material_ban"
      material_keywords: ["303", "free-machining", "free machining"]
      rationale: "Free-machining steels contain sulfur/selenium inclusions that create corrosion initiation sites"

  - mpr_number: 63
    mpr_id: "MPR-063"
    section: "4.2.2.2.3"
    title: "Steel Ductile-Brittle Transition"
    shall_text: "Steels shall not be used in tension below their ductile-brittle transition temperature."
    verification_method: "Analysis"
    applicability_triggers:
      - "metallic_material"
      - "cryogenic"
    related_failure_modes:
      - "fs"
    priority: 10

  # --- Titanium ---
  - mpr_number: 65
    mpr_id: "MPR-065"
    section: "4.2.2.3.1"
    title: "Titanium Surface Condition"
    shall_text: "Surfaces of titanium mill products for mission-critical functions shall be 100% machined, chemically milled, or pickled."
    verification_method: "Inspection"
    applicability_triggers:
      - "titanium"
    related_failure_modes:
      - "fs"
      - "scc"
    priority: 20

  - mpr_number: 67
    mpr_id: "MPR-067"
    section: "4.2.2.3.3"
    title: "Titanium LOX/GOX Prohibition"
    shall_text: "Titanium alloys shall not be used with LOX or GOX at any pressure or with air at oxygen partial pressures above 35 kPa."
    verification_method: "Analysis"
    applicability_triggers:
      - "titanium"
    related_failure_modes:
      - "flam"
      - "o2_prohibited"
    priority: 1
    prohibition:
      type: "material_environment"
      material_keywords: ["titanium", "ti-6al-4v", "ti-", "ti 6al", "ti6al", "cp-ti", "imi"]
      environment_condition: "oxygen_service"
