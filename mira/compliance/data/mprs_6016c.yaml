# =============================================================================
# TRIGGER DEFINITIONS
# =============================================================================
trigger_definitions:
  always:
    description: "Applies to all materials"
    condition: "true"
  habitable:
    description: "Material is in habitable volume"
    condition: "environment.habitable == true"
  oxygen_service:
    description: "Material is in oxygen-enriched environment"
    condition: "environment.o2_pct > 23.5"
  hydrogen_service:
    description: "Material is in hydrogen service"
    condition: "environment.hydrogen_service == true"
  cryogenic:
    description: "Material is in cryogenic service (< -150°C)"
    condition: "environment.temp_range_c[0] <= -150"
  high_pressure:
    description: "Material is in high pressure service (>= 300 psia)"
    condition: "environment.pressure_psia >= 300"
  fracture_critical:
    description: "Part is classified as fracture critical"
    condition: "hardware.fracture_critical == true"
  crew_contact:
    description: "Material has direct crew contact"
    condition: "hardware.crew_contact == true"
  metallic_material:
    description: "Material is metallic"
    condition: "Detected from material name/spec keywords"
  nonmetallic_material:
    description: "Material is nonmetallic"
    condition: "Detected from material name/spec keywords"
  composite_material:
    description: "Material is composite"
    condition: "Detected from material name/spec keywords"
  aluminum_alloy:
    description: "Material is aluminum alloy"
    condition: "Detected from material name: 2xxx, 5xxx, 6xxx, 7xxx series, or 'aluminum'"
  titanium:
    description: "Material is titanium alloy"
    condition: "Detected from material name: Ti-, titanium, Ti6Al4V, etc."
  magnesium:
    description: "Material is magnesium alloy"
    condition: "Detected from material name: AZ31, magnesium, etc."
  beryllium:
    description: "Material is beryllium or beryllium-containing alloy"
    condition: "Detected from material name: beryllium, BeCu, etc."
  high_strength_alloy:
    description: "Material has tensile strength > 180 ksi"
    condition: "material.tensile_strength_ksi > 180 or known high-strength alloy"
  dissimilar_metals:
    description: "Dissimilar metal combination present"
    condition: "hardware.dissimilar_metals == true"
  fluid_contact:
    description: "Material contacts process fluid"
    condition: "hardware.fluid_contact == true or environment has fluid exposure"
  propellant_service:
    description: "Material contacts propellant"
    condition: "environment.propellant_service == true"
  oxidizer_service:
    description: "Material contacts non-O2 oxidizer (NTO, etc.)"
    condition: "environment.oxidizer_service == true"
  external_environment:
    description: "Material exposed to external space environment"
    condition: "environment.vacuum_exposure == true or environment.lunar_dust == true"
  vacuum:
    description: "Material exposed to vacuum"
    condition: "environment.vacuum_exposure == true"
  nonconforming:
    description: "Material has identified nonconformance"
    condition: "material.has_nonconformance == true"
  ignition_source_present:
    description: "Ignition source present in zone"
    condition: "hardware.ignition_sources is not empty"
  elastomer:
    description: "Material is elastomeric"
    condition: "Detected from name: rubber, elastomer, silicone, EPDM, Viton, etc."
  adhesive:
    description: "Material is adhesive"
    condition: "Detected from name: adhesive, bond, epoxy"
  coating:
    description: "Material is coating"
    condition: "Detected from name: coating, paint, anodize, plating"
  seal:
    description: "Material is seal/gasket"
    condition: "Detected from name: seal, gasket, o-ring"
  wiring:
    description: "Material is wiring/cable insulation"
    condition: "Detected from name: wire, cable, harness, insulation"
  cable:
    description: "Same as wiring"
    condition: "Detected from name: wire, cable, harness"
  cots:
    description: "Commercial off-the-shelf item"
    condition: "Detected from name: COTS, off-the-shelf, commercial"
  lubricant:
    description: "Material is lubricant"
    condition: "Detected from name: lubricant, grease, oil"
  optical_surface:
    description: "Material is optical surface"
    condition: "Detected from name: optic, lens, window, mirror"
  welded:
    description: "Part involves welding"
    condition: "Detected from application/process keywords"
  bonded:
    description: "Part involves adhesive bonding"
    condition: "Detected from application/process keywords"
  heat_treated:
    description: "Part is heat treated"
    condition: "Detected from application/process keywords"
  plated:
    description: "Part has plating"
    condition: "Detected from application/process keywords"
  soldered:
    description: "Part involves soldering"
    condition: "Detected from application/process keywords"
  forged:
    description: "Part is forged"
    condition: "Detected from application/process keywords: forging, forged"
  cast:
    description: "Part is cast"
    condition: "Detected from application/process keywords: casting, cast, investment cast"
  formed_panel:
    description: "Part is formed panel"
    condition: "Detected from application/process keywords: formed panel, stretch formed, age formed"
  brazed:
    description: "Part involves brazing"
    condition: "Detected from application/process keywords: braze, brazed, brazing"
  machined:
